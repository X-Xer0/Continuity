# continuity-kit — Hyprland integration
# Installed as ~/.config/hypr/UserConfigs/02-Continuity.conf
# Remove these lines (or the source line in hyprland.conf) to disable.

# Control plane daemon (notifications, clipboard, SMS, remote commands)
exec-once = kdeconnectd

# Keep the Wayland clipboard alive after source apps close (needed for KDE Connect clipboard sync)
exec-once = wl-clip-persist --clipboard regular --reconnect-tries INF

# NOTE: cliphist watchers already exist in configs/Startup_Apps.conf (lines 33-34).
# Do not add duplicates here.

# Continuity launcher
bindd = $mainMod SHIFT, P, Continuity menu, exec, $HOME/.local/bin/ck-menu
bindd = $mainMod SHIFT, M, Mirror phone screen, exec, $HOME/.local/bin/ck-mirror
