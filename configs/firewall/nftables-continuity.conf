# continuity-kit — nftables rules TEMPLATE (manual review required)
#
# This machine currently has NO active firewall manager, so nothing needs to
# be applied. Keep this file for the day a firewall (ufw/firewalld/raw nftables)
# gets enabled. Review against your existing ruleset before use: do NOT paste
# blindly into /etc/nftables.conf.
#
# Ports:
#   1714-1764 tcp/udp  KDE Connect
#   1716      udp      KDE Connect discovery (broadcast)
#   53317     tcp/udp  LocalSend
#   22000     tcp/udp  Syncthing transfer
#   21027     udp      Syncthing local discovery

table inet continuity {
  chain input {
    type filter hook input priority filter; policy accept;

    tcp dport { 1714-1764, 53317, 22000 } accept comment "continuity-kit"
    udp dport { 1716, 53317, 22000, 21027 } accept comment "continuity-kit"
  }
}
